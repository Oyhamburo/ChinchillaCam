[package]
name = "usb-probe"
version = "0.1.0"
edition = "2021"

[lib]
name = "usb_probe"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.2"
rcgen = { version = "0.12", features = ["pem"] }
rusb = "0.9"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFString", "CFNumber"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMFormatDescription", "CMBlockBuffer", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVReturn", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "VTBase", "VTErrors", "VTSession", "VTDecompressionSession", "VTDecompressionProperties", "objc2-core-media", "objc2-core-video"] }
