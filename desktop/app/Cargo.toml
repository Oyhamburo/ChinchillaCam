[package]
name = "chinchillacam-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "chinchillacam_app"
path = "src/lib.rs"

[[bin]]
name = "chinchillacam"
path = "src/main.rs"

[dependencies]
usb-probe = { path = "../usb-probe" }
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts"] }
qrcode = { version = "=0.14.1", default-features = false }
