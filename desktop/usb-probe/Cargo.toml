[package]
name = "usb-probe"
version = "0.1.0"
edition = "2021"

[lib]
name = "usb_probe"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.2"
rcgen = { version = "0.12", features = ["pem"] }
rusb = "0.9"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "0.10"
